name: Build
on: workflow_dispatch

jobs:
  # Build job. Builds app for Android with Buildozer
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      
      - name : Display GitHub Runner Info
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Temp Directory: $RUNNER_TEMP"
          echo "Runner Workspace Directory: $RUNNER_WORKSPACE"
          echo "User: $USER"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk wget
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade buildozer cython
          pip install --upgrade python-for-android
      - name: Build with Buildozer
        run: |
          yes | buildozer android debug
                
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk