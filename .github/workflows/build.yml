name: Build
on: workflow_dispatch

jobs:
  # Build job. Builds app for Android with Buildozer
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
      
      - name : Display GitHub Runner Info
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Temp Directory: $RUNNER_TEMP"
          echo "Runner Workspace Directory: $RUNNER_WORKSPACE"
          echo "User: $USER"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
                  sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            cmake \
            ca-certificates \
            wget \
            unzip \
            git \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3-dev \
            libpng-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxcb1-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade buildozer cython
          pip install --upgrade python-for-android
      - name: Build with Buildozer
        run: |
          yes | buildozer android debug
                
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk